[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gamedb"
dynamic = ["version"]
description = "Game Database - Jekyll static site with IGDB data"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "AGPL-3.0-only"}
authors = [
    {name = "LizardByte", email = "lizardbyte@users.noreply.github.com"}
]

dependencies = [
    "igdb-api-v4==0.3.3",
    "python-dotenv==1.2.2",
    "requests==2.34.2",
    "requests-cache==1.3.2",
]

[project.optional-dependencies]
dev = [
    "flake8==7.3.0",
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
    "requests-mock==1.12.1",
]

[project.urls]
Homepage = "https://LizardByte.github.io/GameDB"
Repository = "https://github.com/LizardByte/GameDB"
Issues = "https://github.com/LizardByte/GameDB/issues"

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-rxXs",
    "--tb=native",
    "--verbose",
    "--color=yes",
    "--cov=src",
    "--cov-report=term-missing",
    "--junitxml=junit-python.xml",
    "-o", "junit_family=legacy",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
